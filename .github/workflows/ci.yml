name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch (Windows and Linux)
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.6,<3"
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Build distributions
        run: python -m build
      - name: Install built wheel with the cross-platform installer
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path('dist').glob('*.whl')
          subprocess.run([sys.executable, 'install.py', '--venv', '.installed',
                          '--workspace', './model lab 日本語', '--wheel', str(wheel)], check=True)
      - name: Check and test the isolated installation
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path
          directory = Path('.installed').resolve()
          python = directory / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          scripts = directory / ('Scripts' if sys.platform == 'win32' else 'bin')
          suffix = '.exe' if sys.platform == 'win32' else ''
          for name, flag in [('local-model-mcp', '--version'), ('local-model-benchmark', '--help')]:
              subprocess.run([str(scripts / (name + suffix)), flag], check=True)
          config = json.loads((directory / 'mcp-config.json').read_text(encoding='utf-8'))
          assert Path(config['mcpServers']['local-model-lab']['command']) == python
          assert not Path('model lab 日本語').exists(), 'Installer must not create model data'
          subprocess.run([str(python), '-m', 'pip', 'install', 'pytest>=8'], check=True)
          subprocess.run([str(python), '-m', 'pytest', '-q'], check=True)
